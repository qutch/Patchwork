# Test fixture (contracts V18): one HTML table document -> one SQLite row per table row, with a declared
# cross-check (the Line column adds up to the Sum footer). Used by tests/engine/test_rows_pipeline.py.
spec_version: 1
name: table_lines
intent: "Copy every line of each table into the lines table"
source:
  kind: api
  base_url: patchwork://control
  list: {method: GET, path: /api/documents, params: {since: "{cursor}", integration: table_lines}}
  record_id: id
  text_field: text
  html_field: html
  cursor_field: seq
extract:
  route_by: site
  parsers:
    - id: shop
      match: {site: shop.example}
      origin: {kind: fixture}
      fields:
        ref:   {json_path: "$.meta.subject", regex: 'Ref\s+(\S+)'}
        total: {regex: 'Sum\s+\$?(\S+)', clean: money}
      rows:
        select: {table: {columns: [Item, Qty]}}
        fields:
          item: {column: Item}
          qty:  {column: Qty, cast: int}
          line: {column: Line, clean: money}
validate:
  - {field: item, rule: required}
  - {rule: sum_equals, rows_field: line, field: total}
dedupe: {key: [ref, record.row_no]}
sink:
  kind: sqlite
  path: lines.db
  table: lines
  fields:
    Ref:  {from: ref}
    Row:  {from: record.row_no}
    Of:   {from: record.row_count}
    Item: {from: item}
    Qty:  {from: qty}
    Line: {from: line}
  verify: {read_back: true}
