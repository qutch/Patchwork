petitive advantage. It''s time to prove it.</p>\n<p>&nbsp;</p>\n<p><strong style=\"font-size: 18px;\">The Role</strong></p>\n<p>&nbsp;</p>\n<p>In this fellowship, you''ll participate in a comprehensive training program with our partner, <a href=\"https://www.ontologize.com/\">Ontologize</a>, to level up your technical skills on Foundry and AIP. You''ll learn how to deploy Palantir''s advanced software to solve tough problems in enterprise settings and have the opportunity to engage directly with Palantir engineers and leadership.<br><br>The fellowship runs for 12 weeks, beginning on January 13, 2027. You are expected to attend live virtual sessions on two weeknights each week. We will also have optional sessions once a week and office hours throughout the duration of the program. Expect to spend 10 to 15 hours per week on instruction and project work throughout the fellowship. <br><br>This program provides valuable training to participants and is unpaid.<br><br>The window for submitting American Tech Fellowship applications is now through December 11, 2026.</p>\n<p>&nbsp;</p>\\n<p></p><p><br></p><b>What We’re Looking For</b><div>We want builders: people who are hungry to learn whatever it takes to succeed and aren''t afraid to roll up their sleeves and make it happen.<br><br>You might be that kind of person if you''ve taught yourself, or been the local go-to, in one or more of these areas:\n<ul>\n<li>Software, data, or automation</li>\n<li>General-purpose programming languages such as Python, C/C++, C# / .NET, Rust, Go, Java, TypeScript/JavaScript</li>\n<li>Data science applications such as SQL, MATLAB, Simulink, R, Julia, Excel + VBA</li>\n<li>Process improvements like instrumenting, automating, or optimizing how things run</li>\n<li>Prototyping—i.e., testing ideas iteratively instead of waiting for perfect specs</li>\n</ul>\n</div><p><br></p><b>What We Value</b><div>Show us where you''ve flexed that builder''s mindset. That could look like:\n<ul>\n<li>Formal study