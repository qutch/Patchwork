nd maintaining, live backend systems</li>\n<li>In-depth understanding of data structures, system architecture, API development for microservices frameworks, distributed systems and other backend-related concepts and best practices</li>\n<li>Engineering background in Computer Science, Mathematics, Software Engineering, Physics or similar field</li>\n<li>Strong coding skills with demonstrated proficiency in programming languages, such as Java, C++, Python, Rust, or similar languages</li>\n<li>Strong written and verbal communication skills and ability to iterate quickly with teammates, incorporating feedback and holding a high bar for quality</li>\n</ul><p><br></p><p></p>\\n<p><strong><span style=\"font-size: 18px;\">Life at Palantir</span></strong></p>\n<p>&nbsp;</p>\n<p>We want every Palantirian to achieve their best outcomes, that’s why we celebrate individuals’ strengths, skills, and interests, from your first interview to your longterm growth, rather than rely on traditional career ladders. Paying attention to the needs of our community enables us to optimize our opportunities to grow and helps ensure many pathways to success at Palantir. Promoting health and well-being across all areas of Palantirians’ lives is just one of the ways we’re investing in our community. Learn more at <a href=\"https://www.palantir.com/careers/life-at-palantir/\">Life at Palantir</a> and note that our offerings may vary by region.</p>\n<p>&nbsp;</p>\n<p>In keeping consistent with Palantir’s values and culture, we believe employees are “better together” and in-person work affords the opportunity for more creative outcomes. Therefore, we encourage employees to work from our offices to foster connectivity and innovation. Many teams do offer hybrid options (WFH a day or two a week), allowing our employees to strike the right trade-off for their personal productivity. Based on business need, there are a few roles that allow for “Remote” work on an exceptional basis. If you are applying for 