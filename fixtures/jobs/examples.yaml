the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.</p><div style=\\\"min-height:1.2em;margin-top:0px;margin-bottom:0px\\\"> </div><p style=\\\"min-height:1.5em\\\"><em>Beware of recruiting scams: Ramp will only contact you through official @</em><a target=\\\"_blank\\\" rel=\\\"noopener noreferrer nofollow\\\" href=\\\"http://Ramp.com\\\"><em>Ramp.com</em></a><em> email addresses and will never ask for payment or sensitive personal information during the hiring process.</em></p><div style=\\\"min-height:1.2em;margin-top:0px;margin-bottom:0px\\\"> </div><p style=\\\"min-height:1.5em\\\"><a target=\\\"_blank\\\" rel=\\\"noopener noreferrer nofollow\\\" href=\\\"https://ramp.com/legal/applicant-privacy-notice\\\">Ramp Applicant Privacy Notice</a></p>\",\"directApply\":true,\"identifier\":{\"@type\":\"PropertyValue\",\"name\":\"Ramp\",\"value\":\"f564dcf9-9390-4a3f-896f-8047a5086040\"},\"datePosted\":\"2025-07-31\",\"hiringOrganization\":{\"@type\":\"Organization\",\"name\":\"Ramp\",\"sameAs\":\"https://ramp.com\",\"logo\":\"https://app.ashbyhq.com/api/images/org-theme-logo/7a158cac-9866-4881-95a8-bc946d3dca79/c68257b4-5a2d-4ecc-93a6-fe3c6766ce8b/55852d64-3584-498c-8afb-0679e5c9dede.png\"},\"jobLocation\":{\"@type\":\"Place\",\"address\":{\"@type\":\"PostalAddress\",\"addressLocality\":\"New York City\",\"addressRegion\":\"NY\",\"addressCountry\":\"USA\"}},\"employmentType\":\"FULL_TIME\",\"baseSalary\":{\"@type\":\"MonetaryAmount\",\"currency\":\"USD\",\"value\":{\"@type\":\"QuantitativeValue\",\"minValue\":189000,\"maxValue\":330000,\"unitText\":\"YEAR\"}},\"jobLocationType\":\"TELECOMMUTE\",\"applicantLocationRequirements\":[{\"@type\":\"Country\",\"name\":\"Canada\"},{\"@type\":\"Country\",\"name\":\"USA\"},{\"@type\":\"Country\",\"name\":\"United States\"}]}</script>\n  \n  \n\n    <link rel=\"stylesheet\" type=\"text/css\" href=\"https://cdn.ashbyprd.com/frontend_non_user/b50cb9203b8003