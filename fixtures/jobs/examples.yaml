    html: '<!DOCTYPE html><html><head prefix="og: http://ogp.me/ns#"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Palantir Technologies - Backend Software Engineer - Application Development</title><meta name="twitter:card" value="summary"><meta name="twitter:title" content="Palantir Technologies - Backend Software Engineer - Application Development"><meta name="twitter:description" content="The Role Backend Software Engineers at Palantir build software at scale to transform how organisations use data. Our Software Engineers are involved throughout the product lifecycle, from idea generation, design, prototyping, and production delivery. You will collaborate closely with technical and non-technical teammates to understand our customers'' problems and build products that solve them. We encourage movement across teams to share context, skills, and experience, so you''ll learn about many different technologies and aspects of each product. Engineers work autonomously and make decisions independently, within a community that will support and challenge you as you grow and develop, becoming a strong technical contributor and engineering leader. Your day-to-day workflow will vary, adapting to the requirements of our users and the technical challenges that arise. One day, you may find yourself collaborating with other engineers to architect a new system that enables a novel workf"><meta name="twitter:label1" value="Location"><meta name="twitter:data1" value="London, United Kingdom"><meta name="twitter:label2" value="Team"><meta name="twitter:data2" value="Dev"><meta property="og:title" content="Palantir Technologies - Backend Software Engineer - Application Development"><meta property="og:description" content="The Role Backend Software Engineers at Palantir build software at scale to transform how organisations use data. Our Software Engineers are involved throughout the product lifecycle, from idea generation, design, prototyping, and production delivery. You will collaborate closely with technical and non-technical teammates to understand our customers'' problems and build products that solve them. We encourage movement across teams to share context, skills, and experience, so you''ll learn about many different technologies and aspects of each product. Engineers work autonomously and make decisions independently, within a community that will support and challenge you as you grow and develop, becoming a strong technical contributor and engineering leader. Your day-to-day workflow will vary, adapting to the requirements of our users and the technical challenges that arise. One day, you may find yourself collaborating with other engineers to architect a new system that enables a novel workf"><meta property="og:url" content="https://jobs.lever.co/palantir/10dfc8bc-99ad-4ca2-ab76-853cb90a92c2"><meta property="og:image" content="https://lever-client-logos.s3-us-west-2.amazonaws.com/b8300af6-ed1c-4d0b-8956-cee7839555b9-1586196845320.png"><meta property="og:image:height" content="630"><meta property="og:image:width" content="1200"></head><body class="show header-compact"><div class="cc-revoke cc-bottom cc-animate" style="display: none;">Cookie Policy</div><div role="dialog" aria-live="polite" aria-label="cookieconsent" aria-describedby="cookieconsent:desc" class="cc-window cc-banner cc-type-opt-in cc-theme-block cc-bottom " style=""><div class="momentum-body"><div class="message message-inverse flex-column"><div class="icon">🍪</div><div class="message-buttons cc-desktop"><button class="button button-sm cc-btn cc-deny" href="#">Deny</button><button class="button button-sm button-primary cc-btn cc-allow" href="#">Accept</button></div><h4 class="text-white">Privacy Notice</h4><p>This website uses cookies to improve your web experience. By clicking <b>Accept</b>, you agree to the use of cookies. <a class="cookie-banner-link" href="https://www.employinc.com/cookie-policy/" target="_blank">Cookie Policy</a></p><div class="self-end cc-mobile m1"><button class="button button-sm cc-btn cc-deny" href="#">Deny</button><button class="button button-sm button-primary cc-btn cc-allow" href="#">Accept</button></div></div></div></div><div class="page show"><div class="main-header page-full-width section-wrapper"><div class="main-header-content page-centered narrow-section page-full-width"><a href="https://jobs.lever.co/palantir" class="main-header-logo"><img alt="Palantir Technologies logo" src="https://lever-client-logos.s3.us-west-2.amazonaws.com/b8300af6-ed1c-4d0b-8956-cee7839555b9-1599675095718.png"></a></div></div></div><div class="content-wrapper posting-page"><div class="content"><div class="section-wrapper accent-section page-full-width"><div class="section page-centered posting-header"><div class="posting-headline"><h2>Backend Software Engineer - Application Development</h2><div class="posting-categories"><div href="#" class="sort-by-time posting-category medium-category-label width-full capitalize-labels location">London, United Kingdom</div><div href="#" class="sort-by-team posting-category medium-category-label capitalize-labels department">Dev /</div><div href="#" class="sort-by-commitment posting-category medium-category-label capitalize-labels commitment">Full-time /</div><div href="#" class="sort-by-time posting-category medium-category-label capitalize-labels workplaceTypes">Hybrid</div></div></div><div class="postings-btn-wrapper"><a class="postings-btn template-btn-submit black" href="https://jobs.lever.co/palantir/10dfc8bc-99ad-4ca2-ab76-853cb90a92c2/apply">Apply</a></div></div></div><div class="section-wrapper page-full-width"><div class="section page-centered" data-qa="job-description"><div><strong><span style="font-size: 18px;">A World-Changing Company</span></strong></div>

      <div>&nbsp;</div>

      <div>Palantir builds the world’s leading software for data-driven decisions and operations. By bringing the right data to the people who need it, our platforms empower our partners to develop lifesaving drugs, forecast supply chain disruptions, locate missing children, and more.</div><div><br></div><div><strong style="font-size: 18px;">The Role</strong></div>

      <div>&nbsp;</div>

      <div><strong>Backend Software Engineers</strong> at Palantir build software at scale to transform how organisations use data. Our Software Engineers are involved throughout the product lifecycle, from idea generation, design, prototyping, and production delivery. You will collaborate closely with technical and non-technical teammates to understand our customers'' problems and build products that solve them. We encourage movement across teams to share context, skills, and experience, so you''ll learn about many different technologies and aspects of each product. Engineers work autonomously and make decisions independently, within a community that will support and challenge you as you grow and develop, becoming a strong technical contributor and engineering leader.</div>

      <div>&nbsp;</div>

      <div>Your day-to-day workflow will vary, adapting to the requirements of our users and the technical challenges that arise. One day, you may find yourself collaborating with other engineers to architect a new system that enables a novel workflow, the next you could be fine-tuning performance to enable low-latency operational outcomes.</div>

      <div>&nbsp;</div>

      <div>Our Product Development organisation is made up of small teams of Software Engineers. Each team focuses on a specific aspect of a product and work collaboratively to build cross functional capabilities, streamline user workflows and continuously improve our software''s efficiency and reliability.</div>

      <div>&nbsp;</div>

      <div>We’re hiring engineers who are passionate about solving real-world problems and empowering both developers and end-users to work optimally. If you’re motivated to develop reliable, performant, and scalable systems, and to design robust APIs and primitives, this role offers the opportunity to make a significant impact on our products and the people who use them.</div>

      <div>&nbsp;</div>

      <div><strong style="font-size: 18px;">Frontline</strong></div>

      <div>&nbsp;</div>

      <div>Foundry Software Engineers may be offered the opportunity to Frontline, an exclusive program unlike any other. This unique, short-term assignment involves being embedded with customers, allowing you to work directly with users and gain firsthand insight into how our products are used and the challenges our customers face. Unlike traditional engineering roles, Frontline immerses you in complex, ambiguous problems, empowering you to deliver impactful solutions across some of the world’s most important industries and institutions.</div>

      <div>&nbsp;</div>

      <div>Some of our most successful products were built on the factory floor, addressing real-world problems for the world''s most important institutions. These products were developed by some of our most successful product engineers, who began their careers in roles aligned with Frontline responsibilities, gaining a deep understanding of both our technology and our customers.</div>

      <div>&nbsp;</div>

      <div>Frontliners operate across a broad spectrum of responsibilities, much like a startup CTO. They work in small teams to own the end-to-end execution of high-stakes projects. This spectrum ranges from discussing architecture and building custom web apps to conducting workshops with users and strategizing with customer executives. No two days are alike, as each day is diverse and impactful. By witnessing how customers engage with Foundry and experiencing these pain points firsthand, you’ll gain unique insights that feed directly back into our development process, helping to refine and enhance our products.</div></div><div class="section page-centered"><div><h3>Core Responsiblities</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><ul>

      <li>Architecting, developing, and maintaining high-performance, scalable backend services that underpin our our operational data and AI systems</li>

      <li>Maintaining high coding standards through the development of guidelines, active participation in code reviews, and fostering a culture of continuous improvement and knowledge sharing among your team</li>

      <li>Building robust APIs for use by front-end developers and interfacing external systems, and collaborating with front-end developers to integrate user-facing elements with server-side logic</li>

      <li>Designing efficient data structures and algorithms to manage large-scale and high throughput data</li>

      <li>Optimizing applications for speed and scalability through performance analysis</li>

      <li>Actively improve user workflows by collaborating with cross-functional teams, ensuring seamless experiences across product boundaries and a cohesive user experience</li>

      </ul></div></div></div></div><div class="section page-centered"><div><h3>Technologies We Use</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><ul>

      <li>Different backend languages, including Java, Rust, Python and Go</li>

      <li>Distributed systems technologies such as Kafka, Cassandra, Elasticsearch and Spark</li>

      <li>Docker and Kubernetes for containerisation and orchestration</li>

      <li>Industry-standard build tooling, including Gradle and GitHub</li>

      </ul></div></div></div></div><div class="section page-centered"><div><h3>What We Value</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><ul>

      <li>A deep understanding of server-side logic, efficient data handling, and distributed systems</li>

      <li>Strong focus on creating user-oriented workflows and solutions, crossing product boundaries to deliver cohesive and solid user workflows that ensure a seamless and intuitive user experience</li>

      <li>Experience building high-quality software in a fast-paced CI/CD development environment</li>

      <li>Ability to work collaboratively in teams of technical and non-technical individuals and understand how technical decisions impact the people who will use what you''re building</li>

      <li>Skill and comfort working in a constantly evolving environment with dynamic objectives and iteration with users</li>

      <li>Active UK Security clearance, or eligibility and willingness to obtain a UK Security clearance is beneficial but not necessary</li>

      </ul></div></div></div></div><div class="section page-centered"><div><h3>What We Require</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><ul>

      <li>Experience in designing and developing features and improvements, as well as supporting and maintaining, live backend systems</li>

      <li>In-depth understanding of data structures, system architecture, API development for microservices frameworks, distributed systems and other backend-related concepts and best practices</li>

      <li>Engineering background in Computer Science, Mathematics, Software Engineering, Physics or similar field</li>

      <li>Strong coding skills with demonstrated proficiency in programming languages, such as Java, C++, Python, Rust, or similar languages</li>

      <li>Strong written and verbal communication skills and ability to iterate quickly with teammates, incorporating feedback and holding a high bar for quality</li>

      </ul></div></div></div></div><div class="section page-centered" data-qa="closing-description"><div><strong><span style="font-size: 18px;">Life at Palantir</span></strong></div>

      <div>&nbsp;</div>

      <div>We want every Palantirian to achieve their best outcomes, that’s why we celebrate individuals’ strengths, skills, and interests, from your first interview to your longterm growth, rather than rely on traditional career ladders. Paying attention to the needs of our community enables us to optimize our opportunities to grow and helps ensure many pathways to success at Palantir. Promoting health and well-being across all areas of Palantirians’ lives is just one of the ways we’re investing in our community. Learn more at <a href="https://www.palantir.com/careers/life-at-palantir/">Life at Palantir</a> and note that our offerings may vary by region.</div>

      <div>&nbsp;</div>

      <div>In keeping consistent with Palantir’s values and culture, we believe employees are “better together” and in-person work affords the opportunity for more creative outcomes. Therefore, we encourage employees to work from our offices to foster connectivity and innovation. Many teams do offer hybrid options (WFH a day or two a week), allowing our employees to strike the right trade-off for their personal productivity. Based on business need, there are a few roles that allow for “Remote” work on an exceptional basis. If you are applying for one of these roles, you must work from the city and or country in which you are employed. If the posting is specified as Onsite, you are required to work from an office.</div>

      <div>&nbsp;</div>

      <div>If you want to empower the world''s most important institutions, you belong here. Palantir values excellence regardless of background. We are committed to making the application and hiring process accessible to everyone and will provide a reasonable accommodation for those living with a disability. If you need an accommodation for the application or hiring process<em>, </em>please <a href="mailto:accommodations@palantir.com">reach out</a> and let us know how we can help.</div>

      <div>&nbsp;</div>

      <div><em>Please note that you will never be asked to submit a payment or share financial information to participate in our interview process. If you suspect that you''ve been contacted by a scammer, we recommend you cease all communication with the individual and consider reporting them to the relevant authorities, such as the US <a href="https://www.ic3.gov/">FBI Internet Crime Complaint Center (IC3)</a>.</em></div></div><div class="section page-centered last-section-apply" data-qa="btn-apply-bottom"><a class="postings-btn template-btn-submit black" data-qa="show-page-apply" href="https://jobs.lever.co/palantir/10dfc8bc-99ad-4ca2-ab76-853cb90a92c2/apply">Apply</a></div></div></div></div><div class="main-footer page-full-width"><div class="main-footer-text"><p><a href="https://www.palantir.com/">Palantir Technologies Home Page</a></p><a href="https://www.lever.co/job-seeker-support/" class="image-link"><span>Jobs powered by </span><img alt="Lever logo" src="/img/lever-logo-refresh.svg" class="footer-logo"></a></div></div><script type="application/ld+json">{"@context" : "http://schema.org","@type" : "JobPosting","title" : "Backend Software Engineer - Application Development","hiringOrganization" : {"@type" : "Organization","name": "Palantir Technologies","logo": "https://lever-client-logos.s3.us-west-2.amazonaws.com/b8300af6-ed1c-4d0b-8956-cee7839555b9-1599675095718.png"},"jobLocation":{"@type" : "Place","address" : {"@type" : "PostalAddress","addressLocality" : "London, United Kingdom","addressRegion" : null,"addressCountry" : null,"postalCode" : null}},"employmentType" : "Full-time","datePosted" : "2024-03-11","description" : "<p><strong><span style=\"font-size: 18px;\">A World-Changing Company</span></strong></p>\n<p>&nbsp;</p>\n<p>Palantir builds the world’s leading software for data-driven decisions and operations. By bringing the right data to the people who need it, our platforms empower our partners to develop lifesaving drugs, forecast supply chain dis