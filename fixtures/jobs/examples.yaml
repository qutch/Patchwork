.5em\">The problems are high-stakes, data-dense, and unforgiving.</p><p style=\"min-height:1.5em\">We hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.</p><p style=\"min-height:1.5em\">The median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.</p><p style=\"min-height:1.5em\">If you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.</p><p style=\"min-height:1.5em\"></p><h1>About the Role</h1><p style=\"min-height:1.5em\">The Security Engineering team helps make Ramp the most secure place for our customers to collect, manage, and put to work their business’ financial information&nbsp;</p><p style=\"min-height:1.5em\">Our work centers in three areas:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Ramp builds products with an eye for security</p></li><li><p style=\"min-height:1.5em\">Ramp detects and responds to threats before they cause harm</p></li><li><p style=\"min-height:1.5em\">Security powers Ramp’s growth</p></li></ul><p style=\"min-height:1.5em\">Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://engineering.ramp.com/\">Engineering Blog</a> for more on our tech stack, mission and values!</p><p style=\"min-height:1.5em\"></p><p style=\"min-height:1.5em\">What You’ll Do</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Drive our cloud security roadmap: review our cloud deployments to identify opportunities for improvement</p></li><li><p style=\"min-height:1.5em\">Design and build security-focused infrastructure primitives and integrate them into our existing products and development processes</p></li><li><p style=\"min-height:1.5em\">Lead remediation of prioritized issues across our technology stack</p></li><li><p style=\"min-height:1.5em\">Partner with infrastructure, data, and devops teams to design and deploy solutions that are inherently secure</p></li></ul><p style=\"min-height:1.5em\"></p><h2>What You Need</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Minimum 5 years of experience building software</p></li><li><p style=\"min-height:1.5em\">Minimum 3 years of experience building in AWS (with Terraform)</p></li><li><p style=\"min-height:1.5em\">A strong sense of ownership: you need to drive projects from inception to scaling it in production</p></li><li><p style=\"min-height:1.5em\">Desire to work in a fast-paced environment, continuously grow, and master your craft</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Nice-to-Haves</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with Python (Flask) and Terraform</p></li><li><p style=\"min-height:1.5em\">Experience with Azure, GCP, and other cloud providers</p></li><li><p style=\"min-height:1.5em\">Experience improving the developer experience and security properties of a multi-service deployment</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Benefits available to all full-time Ramp employees (Global)</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Flexible PTO</p></li><li><p style=\"min-height:1.5em\">Centralized home-office equipment ordering</p></li><li><p style=\"min-height:1.5em\">Health and wellness stipend</p></li><li><p style=\"min-height:1.5em\">Budget for intra-office travel</p></li><li><p style=\"min-height:1.5em\">Weekly coffee stipend</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>United States</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">100% medical, dental &amp; vision insurance coverage for you, with partial coverage for dependents</p></li><li><p style=\"min-height:1.5em\">One Medical annual membership</p></li><li><p style=\"min-height:1.5em\">401(k), including employer match on contributions made while employed by Ramp</p></li><li><p style=\"min-height:1.5em\">Fertility HRA (up to $10,000 per year)</p></li><li><p style=\"min-height:1.5em\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay</p></li><li><p style=\"min-height:1.5em\">Pet insurance</p></li><li><p style=\"min-height:1.5em\">In-office perks: lunch, snacks, drinks, and more</p></li><li><p style=\"min-height:1.5em\">Relocation expense coverage to NYC or SF (if needed)</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>Canada</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Group medical, dental, and vision coverage through Sun Life</p></li><li><p style=\"min-height:1.5em\">Life, AD&amp;D, and disability coverage</p></li><li><p style=\"min-height:1.5em\">Fertility drug coverage (up to $4,000 lifetime)</p></li><li><p style=\"min-height:1.5em\">Group Retirement Plan with employer match (RRSP + DPSP)</p></li><li><p style=\"min-height:1.5em\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay</p></li><li><p style=\"min-height:1.5em\">Employee Assistance Program and virtual care through Lumino Health</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>United Kingdom</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Private medical insurance through Freedom Elite</p></li><li><p style=\"min-height:1.5em\">Virtual GP and at-home care via eMed x Livi</p></li><li><p style=\"min-height:1.5em\">Workplace pension through Penfold, with salary sacrifice option</p></li><li><p style=\"min-height:1.5em\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Referral Instructions</strong></h2><p style=\"min-height:1.5em\">If you are being referred for the role, please contact that person to apply on your behalf.</p><div style=\"min-height:1.2em;margin-top:0px;margin-bottom:0px\">&nbsp;</div><h2><strong>Other notices</strong></h2><p style=\"min-height:1.5em\">Pursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.</p><div style=\"min-height:1.2em;margin-top:0px;margin-bottom:0px\">&nbsp;</div><p style=\"min-height:1.5em\"><em>Beware of recruiting scams: Ramp will only contact you through official @</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://Ramp.com\"><em>Ramp.com</em></a><em> email addresses and will never ask for payment or sensitive personal information during the hiring process.</em></p><div style=\"min-height:1.2em;margin-top:0px;margin-bottom:0px\">&nbsp;</div><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://ramp.com/legal/applicant-privacy-notice\">Ramp Applicant Privacy Notice</a></p><p style=\"display: none;\">Compensation Range: $211.4K - $290.6K</p></div><a class=\" _container_j2da7_1\" href=\"/ramp/34413f8d-26bf-4bbc-8ade-eb309a0e2245/application\"><button class=\"_button_zyh3g_28 _primary_zyh3g_97  _greedy_zyh3g_221  \">Apply for this Job</button></a></div></div></div></div><footer class=\"_container_1jx4x_28 \"><a href=\"https://www.ashbyhq.com\" target=\"_blank\" rel=\"noopener\" class=\"_powered_1jx4x_58\" aria-label=\"Learn more about Ashby\"><span>Powered by&nbsp;</span></a><p class=\"_links_1jx4x_97\"><a href=\"https://www.ashbyhq.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"_link_1jx4x_78\">Privacy Policy</a><a href=\"https://www.ashbyhq.com/security\" target=\"_blank\" rel=\"noopener\" class=\"_link_1jx4x_78\">Security</a><a href=\"https://www.ashbyhq.com/disclosure\" target=\"_blank\" rel=\"noopener\" class=\"_link_1jx4x_78\">Vulnerability Disclosure</a></p></footer><div class=\"_toasts_1bmj4_58\"></div></div>\n      \n</body></html>"
    text: 'Software Engineer, Security, Cloud

      Location

      New York, NY (HQ); Miami, FL; Remote (Canada); Remote (US)

      Employment Type

      Full time

      Location Type

      Hybrid

      Department

      Engineering

      Compensation

      $211.4K – $290.6K • Offers Equity

      The final compensation will depend on the location and level at which the candidate is hired.

      OverviewApplication

      About Ramp

      Ramp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.

      The problems are high-stakes, data-dense, and unforgiving.

      We hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.

      The median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.

      If you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.

      About the Role

      The Security Engineering team helps make Ramp the most secure place for our customers to collect, manage, and put to work their business’ financial information

      Our work centers in three areas:

      Ramp builds products with an eye for security

      Ramp detects and responds to threats before they cause harm

      Security powers Ramp’s growth

      Check out our Engineering Blog for more on our tech stack, mission and values!

      What You’ll Do

      Drive our cloud security roadmap: review our cloud deployments to identify opportunities for improvement

      Design and build security-focused infrastructure primitives and integrate them into our existing products and development processes

      Lead remediation of prioritized issues across our technology stack

      Partner with infrastructure, data, and devops teams to design and deploy solutions that are inherently secure

      What You Need

      Minimum 5 years of experience building software

      Minimum 3 years of experience building in AWS (with Terraform)

      A strong sense of ownership: you need to drive projects from inception to scaling it in production

      Desire to work in a fast-paced environment, continuously grow, and master your craft

      Nice-to-Haves

      Experience with Python (Flask) and Terraform

      Experience with Azure, GCP, and other cloud providers

      Experience improving the developer experience and security properties of a multi-service deployment

      Benefits available to all full-time Ramp employees (Global)

      Flexible PTO

      Centralized home-office equipment ordering

      Health and wellness stipend

      Budget for intra-office travel

      Weekly coffee stipend

      United States

      100% medical, dental & vision insurance coverage for you, with partial coverage for dependents

      One Medical annual membership

      401(k), including employer match on contributions made while employed by Ramp

      Fertility HRA (up to $10,000 per year)

      Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay

      Pet insurance

      In-office perks: lunch, snacks, drinks, and more

      Relocation expense coverage to NYC or SF (if needed)

      Canada

      Group medical, dental, and vision coverage through Sun Life

      Life, AD&D, and disability coverage

      Fertility drug coverage (up to $4,000 lifetime)

      Group Retirement Plan with employer match (RRSP + DPSP)

      Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay

      Employee Assistance Program and virtual care through Lumino Health

      United Kingdom

      Private medical insurance through Freedom Elite

      Virtual GP and at-home care via eMed x Livi

      Workplace pension through Penfold, with salary sacrifice option

      Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay

      Referral Instructions

      If you are being referred for the role, please contact that person to apply on your behalf.

      Other notices

      Pursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.

      Beware of recruiting scams: Ramp will only contact you through official @Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.

      Ramp Applicant Privacy Notice

      Compensation Range: $211.4K - $290.6K

      Apply for this Job

      Powered by

