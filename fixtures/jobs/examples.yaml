    html: "<!DOCTYPE html><html lang=\"en\" style=\"--colorPrimary600: #1F1F1F; --colorPrimary900: #1F1F1F;\"><head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, shrink-to-fit=no\">\n    <meta name=\"theme-color\" content=\"#473BCE\">\n    <meta name=\"csp-nonce\" id=\"csp-nonce\" content=\"4vO7BWxonlvq7MqTwF-Xt_NfjQ3nmXPIkH_vfiYslj4\">\n    <link rel=\"icon\" type=\"image/svg+xml\" href=\"https://cdn.ashbyprd.com/cdn_assets/b50cb9203b8003693f6bceeb8fc9b3209b460d20/favicon.svg\">\n    <link rel=\"icon\" type=\"image/png\" href=\"https://cdn.ashbyprd.com/cdn_assets/b50cb9203b8003693f6bceeb8fc9b3209b460d20/favicon.png\" sizes=\"192x192\">\n    <link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"https://cdn.ashbyprd.com/cdn_assets/b50cb9203b8003693f6bceeb8fc9b3209b460d20/apple-touch-icon.png\">\n    <title>Software Engineer, Android @ Ramp</title><meta name=\"title\" content=\"Software Engineer, Android @ Ramp\">\n    \n  \n  <meta name=\"description\" content=\"ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\nABOUT THE ROLE\n\nAs an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.\n\nCheck out our Engineering Blog https://engineering.ramp.com/ for more on our tech stack, mission and values!\n\n\n\n\nWHAT YOU’LL DO\n\n - Design, build, and launch new products to Ramp’s Android app\n\n - Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity\n\n - Conduct code reviews and set engineering standards\n\n - Work with Product and Design to identify key features that will make the app successful\n\n - Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product\n\n\nWHAT YOU NEED\n\n - Minimum 1 year of experience in mobile development\n\n - Proficiency in Kotlin and Compose for Android development\n\n - Experience launching at least one mobile app and/or several features that reached a large number of users\n\n - Desire to work in a fast-paced environment, continuously grow, and master your craft\n\n - Strong understanding of mobile design patterns and best practices\n\n\nNICE TO HAVES\n\n - Experience with web apps (React, TypeScript)\n\n - Experience with backend technologies (Python, Flask, SQL, OpenAPI)\n\n - Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI &amp; Buildkite\n\n - Experience managing apps in the Google Play Console\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\nUNITED STATES\n\n - 100% medical, dental &amp; vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&amp;D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n&nbsp;\n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n&nbsp;\n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n&nbsp;\n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice\">\n  <meta name=\"twitter:card\" content=\"summary\">\n  <meta property=\"og:url\" content=\"https://jobs.ashbyhq.com/ramp/f564dcf9-9390-4a3f-896f-8047a5086040\">\n  <meta property=\"og:type\" content=\"website\">\n  \n  <meta property=\"og:title\" content=\"Software Engineer, Android\">\n  <meta property=\"og:description\" content=\"ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\nABOUT THE ROLE\n\nAs an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.\n\nCheck out our Engineering Blog https://engineering.ramp.com/ for more on our tech stack, mission and values!\n\n\n\n\nWHAT YOU’LL DO\n\n - Design, build, and launch new products to Ramp’s Android app\n\n - Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity\n\n - Conduct code reviews and set engineering standards\n\n - Work with Product and Design to identify key features that will make the app successful\n\n - Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product\n\n\nWHAT YOU NEED\n\n - Minimum 1 year of experience in mobile development\n\n - Proficiency in Kotlin and Compose for Android development\n\n - Experience launching at least one mobile app and/or several features that reached a large number of users\n\n - Desire to work in a fast-paced environment, continuously grow, and master your craft\n\n - Strong understanding of mobile design patterns and best practices\n\n\nNICE TO HAVES\n\n - Experience with web apps (React, TypeScript)\n\n - Experience with backend technologies (Python, Flask, SQL, OpenAPI)\n\n - Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI &amp; Buildkite\n\n - Experience managing apps in the Google Play Console\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\nUNITED STATES\n\n - 100% medical, dental &amp; vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&amp;D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n&nbsp;\n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n&nbsp;\n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n&nbsp;\n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice\">\n  \n  <meta property=\"og:image\" content=\"https://app.ashbyhq.com/api/images/org-theme-social/7a158cac-9866-4881-95a8-bc946d3dca79/c68257b4-5a2d-4ecc-93a6-fe3c6766ce8b/6dd29608-289f-4c8a-9d6e-6f6ac8ea925b.png\">\n  <meta name=\"twitter:title\" content=\"Software Engineer, Android\">\n  <meta name=\"twitter:description\" content=\"ABOUT RAMP\n\nRamp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.\n\nThe problems are high-stakes, data-dense, and unforgiving.\n\nWe hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.\n\nThe median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.\n\nIf you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.\n\n\nABOUT THE ROLE\n\nAs an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.\n\nCheck out our Engineering Blog https://engineering.ramp.com/ for more on our tech stack, mission and values!\n\n\n\n\nWHAT YOU’LL DO\n\n - Design, build, and launch new products to Ramp’s Android app\n\n - Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity\n\n - Conduct code reviews and set engineering standards\n\n - Work with Product and Design to identify key features that will make the app successful\n\n - Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product\n\n\nWHAT YOU NEED\n\n - Minimum 1 year of experience in mobile development\n\n - Proficiency in Kotlin and Compose for Android development\n\n - Experience launching at least one mobile app and/or several features that reached a large number of users\n\n - Desire to work in a fast-paced environment, continuously grow, and master your craft\n\n - Strong understanding of mobile design patterns and best practices\n\n\nNICE TO HAVES\n\n - Experience with web apps (React, TypeScript)\n\n - Experience with backend technologies (Python, Flask, SQL, OpenAPI)\n\n - Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI &amp; Buildkite\n\n - Experience managing apps in the Google Play Console\n\n\nBENEFITS AVAILABLE TO ALL FULL-TIME RAMP EMPLOYEES (GLOBAL)\n\n - Flexible PTO\n\n - Centralized home-office equipment ordering\n\n - Health and wellness stipend\n\n - Budget for intra-office travel\n\n - Weekly coffee stipend\n\n\nUNITED STATES\n\n - 100% medical, dental &amp; vision insurance coverage for you, with partial coverage for dependents\n\n - One Medical annual membership\n\n - 401(k), including employer match on contributions made while employed by Ramp\n\n - Fertility HRA (up to $10,000 per year)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay\n\n - Pet insurance\n\n - In-office perks: lunch, snacks, drinks, and more\n\n - Relocation expense coverage to NYC or SF (if needed)\n\n\nCANADA\n\n - Group medical, dental, and vision coverage through Sun Life\n\n - Life, AD&amp;D, and disability coverage\n\n - Fertility drug coverage (up to $4,000 lifetime)\n\n - Group Retirement Plan with employer match (RRSP + DPSP)\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay\n\n - Employee Assistance Program and virtual care through Lumino Health\n\n\nUNITED KINGDOM\n\n - Private medical insurance through Freedom Elite\n\n - Virtual GP and at-home care via eMed x Livi\n\n - Workplace pension through Penfold, with salary sacrifice option\n\n - Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay\n\n\nREFERRAL INSTRUCTIONS\n\nIf you are being referred for the role, please contact that person to apply on your behalf.\n\n&nbsp;\n\n\nOTHER NOTICES\n\nPursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.\n\n&nbsp;\n\nBeware of recruiting scams: Ramp will only contact you through official @Ramp.com http://Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.\n\n&nbsp;\n\nRamp Applicant Privacy Notice https://ramp.com/legal/applicant-privacy-notice\">\n  \n    <link rel=\"preload\" as=\"image\" href=\"https://app.ashbyhq.com/api/images/org-theme-logo/7a158cac-9866-4881-95a8-bc946d3dca79/c68257b4-5a2d-4ecc-93a6-fe3c6766ce8b/55852d64-3584-498c-8afb-0679e5c9dede.png\"><link rel=\"preload\" as=\"image\" href=\"https://app.ashbyhq.com/api/images/org-theme-wordmark/7a158cac-9866-4881-95a8-bc946d3dca79/c68257b4-5a2d-4ecc-93a6-fe3c6766ce8b/16b650e7-85c4-477d-97b5-7395d094741e.png\">\n    \n    <script type=\"application/ld+json\">{\"@context\":\"https://schema.org/\",\"@type\":\"JobPosting\",\"title\":\"Software Engineer, Android\",\"description\":\"<h1><strong>About Ramp</strong></h1><p style=\\\"min-height:1.5em\\\">Ramp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.</p><p style=\\\"min-height:1.5em\\\">The problems are high-stakes, data-dense, and unforgiving.</p><p style=\\\"min-height:1.5em\\\">We hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.</p><p style=\\\"min-height:1.5em\\\">The median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.</p><p style=\\\"min-height:1.5em\\\">If you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.</p><p style=\\\"min-height:1.5em\\\"></p><h1>About the Role</h1><p style=\\\"min-height:1.5em\\\">As an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.</p><p style=\\\"min-height:1.5em\\\">Check out our <a target=\\\"_blank\\\" rel=\\\"noopener noreferrer nofollow\\\" href=\\\"https://engineering.ramp.com/\\\">Engineering Blog</a> for more on our tech stack, mission and values!</p><h2><br /><br />What You’ll Do</h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Design, build, and launch new products to Ramp’s Android app</p></li><li><p style=\\\"min-height:1.5em\\\">Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity</p></li><li><p style=\\\"min-height:1.5em\\\">Conduct code reviews and set engineering standards</p></li><li><p style=\\\"min-height:1.5em\\\">Work with Product and Design to identify key features that will make the app successful</p></li><li><p style=\\\"min-height:1.5em\\\">Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product</p><p style=\\\"min-height:1.5em\\\"></p></li></ul><h2>What You Need</h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Minimum 1 year of experience in mobile development</p></li><li><p style=\\\"min-height:1.5em\\\">Proficiency in Kotlin and Compose for Android development</p></li><li><p style=\\\"min-height:1.5em\\\">Experience launching at least one mobile app and/or several features that reached a large number of users</p></li><li><p style=\\\"min-height:1.5em\\\">Desire to work in a fast-paced environment, continuously grow, and master your craft</p></li><li><p style=\\\"min-height:1.5em\\\">Strong understanding of mobile design patterns and best practices</p></li></ul><p style=\\\"min-height:1.5em\\\"></p><h2>Nice to Haves</h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Experience with web apps (React, TypeScript)</p></li><li><p style=\\\"min-height:1.5em\\\">Experience with backend technologies (Python, Flask, SQL, OpenAPI)</p></li><li><p style=\\\"min-height:1.5em\\\">Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI &amp; Buildkite</p></li><li><p style=\\\"min-height:1.5em\\\">Experience managing apps in the Google Play Console</p></li></ul><p style=\\\"min-height:1.5em\\\"></p><h2><strong>Benefits available to all full-time Ramp employees (Global)</strong></h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Flexible PTO</p></li><li><p style=\\\"min-height:1.5em\\\">Centralized home-office equipment ordering</p></li><li><p style=\\\"min-height:1.5em\\\">Health and wellness stipend</p></li><li><p style=\\\"min-height:1.5em\\\">Budget for intra-office travel</p></li><li><p style=\\\"min-height:1.5em\\\">Weekly coffee stipend</p></li></ul><p style=\\\"min-height:1.5em\\\"></p><h2><strong>United States</strong></h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">100% medical, dental &amp; vision insurance coverage for you, with partial coverage for dependents</p></li><li><p style=\\\"min-height:1.5em\\\">One Medical annual membership</p></li><li><p style=\\\"min-height:1.5em\\\">401(k), including employer match on contributions made while employed by Ramp</p></li><li><p style=\\\"min-height:1.5em\\\">Fertility HRA (up to $10,000 per year)</p></li><li><p style=\\\"min-height:1.5em\\\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay</p></li><li><p style=\\\"min-h