    html: "<!DOCTYPE html><html lang=\"en\" dir=\"ltr\"><head><meta http-equiv=\"origin-trial\" content=\"3NNj0GXVktLOmVKwWUDendk4Vq2qgMVDBDX+Sni48ATJl9JBj+zF+9W2HGB3pvt6qowOihTbQgTeBm9SKbdTwYAAABfeyJvcmlnaW4iOiJodHRwczovL3JlY2FwdGNoYS5uZXQ6NDQzIiwiZmVhdHVyZSI6IlRwY2QiLCJleHBpcnkiOjE3MzUzNDM5OTksImlzVGhpcmRQYXJ0eSI6dHJ1ZX0=\"><meta http-equiv=\"origin-trial\" content=\"A6iYDRdcg1LVww9DNZEU+JUx2g1IJxSxk4P6F+LimR0ElFa38FydBqtz/AmsKdGr11ZooRgDPCInHJfGzwtR+A4AAACXeyJvcmlnaW4iOiJodHRwczovL3d3dy5yZWNhcHRjaGEubmV0OjQ0MyIsImZlYXR1cmUiOiJEaXNhYmxlVGhpcmRQYXJ0eVN0b3JhZ2VQYXJ0aXRpb25pbmczIiwiZXhwaXJ5IjoxNzU3OTgwODAwLCJpc1N1YmRvbWFpbiI6dHJ1ZSwiaXNUaGlyZFBhcnR5Ijp0cnVlfQ==\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta property=\"og:image\" content=\"https://s2-recruiting.cdn.greenhouse.io/external_greenhouse_job_boards/logos/400/025/200/original/New_Linkedin_Logo_LinkedIn.png?1725582586\"><meta property=\"og:type\" content=\"article\"><link rel=\"canonical\" href=\"http://job-boards.greenhouse.io/discord/jobs/8722538002\"><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&amp;family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700\"><title>Job Application for Engineering Manager, Machine Learning (Safety) at Discord</title><meta property=\"og:title\" content=\"Engineering Manager, Machine Learning (Safety)\"><meta property=\"og:description\" content=\"Remote (US)\"><meta property=\"og:url\" content=\"https://job-boards.greenhouse.io/discord/jobs/8722538002\"><link rel=\"stylesheet\" href=\"https://job-boards.cdn.greenhouse.io/assets/entry-nimHAKwV.css\"><link rel=\"stylesheet\" href=\"https://job-boards.cdn.greenhouse.io/assets/vendor-CKKDukwa.css\"></head><body style=\"--custom-link-color:#3442D9;--custom-active-field-color:#3442D9;--custom-focus-color:#3442D9;--custom-list-hover-color:#808AFF;--custom-primary-typography-color:#3442D9;--custom-button-color:#3442D9;--custom-button-hover-color:#3442D9;--custom-button-text-color:#FFFFFF;--custom-primary-font-family:&quot;Poppins&quot;;--custom-secondary-font-family:&quot;Poppins&quot;;--custom-dropdown-selection-color:#808AFF;--custom-secondary-typography-color:#262626;--custom-secondary-typography-10:#2626261A;--custom-secondary-typography-30:#2626264D;--custom-secondary-typography-60:#26262699;--custom-background-color:#ffffff\"><div class=\"banner-container\"><img src=\"https://s2-recruiting.cdn.greenhouse.io/job_board_renderer/job_board_configurations/banners/400/017/000/original/LinkedIn_Banner_May_2024.png?1725582587\" alt=\"Banner\" class=\"banner\"></div><div id=\"react-portal-mount-point\"></div><main class=\"main font-secondary job-post\"><div class=\"job-post-container\"><div class=\"image-container\"><a href=\"https://boards.greenhouse.io/discord\" target=\"_blank\" rel=\"noreferrer\" class=\"logo\"><img src=\"https://s2-recruiting.cdn.greenhouse.io/external_greenhouse_job_boards/logos/400/025/200/original/New_Linkedin_Logo_LinkedIn.png?1725582586\" alt=\"Discord Logo\" class=\"\"></a></div><div><a class=\"link\" target=\"_top\" href=\"https://job-boards.greenhouse.io/discord\">Back to jobs</a><div class=\"job__tags\"></div><div class=\"job__header\"><div class=\"job__title\"><h1 class=\"section-header section-header--large font-primary\">Engineering Manager, Machine Learning (Safety)</h1><div class=\"job__location\"><div>Remote (US)</div></div></div><button type=\"button\" class=\"btn btn--rounded\" aria-label=\"Apply\">Apply</button></div><div class=\"job__description body\"><div><p>Discord has a highly engaged community of millions of daily active users who use the platform for many different reasons, but there’s one thing that nearly everyone does: <strong>play video games.</strong> Discord plays a uniquely important role in the future of gaming, and we are focused on making it easier and more fun for people to hang out before, during, and after playing games.</p></div><div><p>Discord's Safety ML team builds the machine learning systems that protect 200M+ users. The team's mission is to make Discord a place where people can build genuine friendships without exposure to harm, at a scale where manual review alone can never keep up.</p>\n<p>We're looking for a highly technical, hands-on, and mission-driven Engineering Manager to lead our Safety ML team. As the manager responsible for Safety ML, you will own the detection systems that sit between attackers and our users; real-time and batch models for content understanding, account integrity, and platform abuse.</p>\n<p><strong>What You'll Be Doing</strong></p>\n<ul>\n<li>Build and lead an exceptional team of highly-engaged ML engineers by hiring, coaching, and instilling a sense of ownership and impact.</li>\n<li>Drive the technical vision and roadmap for Safety ML by collaborating with your team and partners across Trust &amp; Safety, Product, Policy, Legal, and Data Science.</li>\n<li>Own the end-to-end lifecycle of production safety models: defining new capabilities, measuring performance, and monitoring the operational health of systems that make millions of enforcement decisions per day.</li>\n<li>Manage processes and leverage your technical expertise to continually raise the bar and ensure your team delivers extraordinary results.</li>\n<li>Partner with Trust &amp; Safety on label quality, golden sets, and automating manual investigations.</li>\n<li>Work with other Engineering Managers to continuously improve the Engineering organization and uphold our <a href=\"https://blog.discordapp.com/the-four-values-of-working-at-discord-90d5b5102cbc\">workplace philosophy</a>.</li>\n</ul>\n<p><strong>What you should have</strong></p>\n<ul>\n<li>You have 5+ years of experience as a Machine Learning Engineer, Data Scientist, or Applied Scientist.</li>\n<li>You have 3+ years of experience as an Engineering Manager and successfully managed a team of 5+ engineers.</li>\n<li>You have hands-on depth in at least one of: abuse/fraud detection, content classification, behavioral modeling, graph-based modeling, or LLM-based classification systems.</li>\n<li>You have strong communication skills and the ability to work well cross-functionally.</li>\n<li>You thrive in ambiguous environments and get excited about figuring out solutions to complex problems, and then executing on them.</li>\n<li>You are a first principles thinker that can work with others to come up with pragmatic solutions.</li>\n<li>You have a proven record of shipping ML systems to production at scale.</li>\n<li>You are passionate about coaching and leading other engineers, but can roll up your sleeves and get elbow deep in code when needed.</li>\n<li>You keep up with the industry trends and continuously identify new technologies to leverage to solve technical problems</li>\n</ul></div><div class=\"job__pay-ranges\"><div class=\"pay-range\"><div class=\"description\"><div class=\"body\"><span><p><em>The base salary range for this full-time position is listed below. This position will also be eligible for equity and benefits. Benefits include medical, dental, and vision insurance; a 401(k) plan; life and disability insurance; paid time off; and paid parental leave. Our salary ranges are determined by role and level. Within the range, individual pay is determined by additional factors, including job-related skills, experience, and relevant education or training. Please note that the compensation details listed in role postings reflect the base salary only, and do not include equity, or benefits. Applications for this role are accepted on an ongoing basis.</em></p></span></div></div><p class=\"body body--medium\">Base Salary</p><p class=\"body\"><bdi>$272,000</bdi> - <bdi>$340,000</bdi> <bdi>USD</bdi></p></div></div><div><p><strong>Why Discord?&nbsp;</strong><br><br>Discord plays a uniquely important role in the future of gaming. We're a multiplatform, multigenerational and multiplayer platform that helps people deepen their friendships around games and shared interests, and helps developers build and grow their businesses. We believe games give us a way to have fun with our favorite people, whether listening to music together or grinding in competitive matches for diamond rank. <strong>Join us in our mission! Your future is just a click away!</strong></p>\n<p><strong>Discord is committed to inclusion and providing reasonable accommodations during the interview process. </strong>We want you to feel set up for success, so if you are in need of reasonable accommodations, please let your recruiter know.</p>\n<p><em><strong>Please see our Applicant and Candidate Privacy Policy for details regarding Discord’s collection and usage of personal information relating to the application and recruitment process by clicking&nbsp;<a href=\"https://discord.com/terms/applicant-candidate-privacy-policy\">HERE.</a></strong></em></p></div></div></div><div class=\"divider\" role=\"separator\"></div><div class=\"application--container\"><div class=\"application--header\"><div class=\"application--header--text\"><div class=\"application--header--title\"><h2 class=\"section-header font-primary\">Apply for this job</h2></div><div class=\"application--header--required\"><div class=\"application--header--required--asterisk\"><p class=\"body body__secondary\">*</p></div><p class=\"body body__secondary\">indicates a required field</p></div></div><div class=\"application--header--buttons\"><div class=\"application--header--apply-with-seek\"></div></div></div><form method=\"get\" action=\"/discord/jobs/8722538002\" id=\"application-form\" class=\"application--form\" data-discover=\"true\"><div class=\"application--questions\"><div class=\"field-wrapper\"><div class=\"text-input-wrapper\"><div class=\"input-wrapper\"><label id=\"first_name-label\" for=\"first_name\" class=\"label label\">First Name<span aria-hidden=\"true\">*</span></label><input id=\"first_na