oard-back-to-all-jobs-button\" href=\"/ramp\"></a></li><li></li></ul></div><div class=\"_container_dea4p_28 \"><div class=\"_titles_dea4p_33 \"><h1 class=\"_title_dea4p_33 _large_dea4p_66 ashby-job-posting-heading\">Software Engineer, Android</h1> </div><div class=\"_content_dea4p_70 _details_5yu8i_417\"><div class=\"_left_5yu8i_421 ashby-job-posting-left-pane  _container_f7cvd_28\" data-highlight=\"none\"><div class=\" _section_f7cvd_36 \"><h2 class=\"_heading_f7cvd_52 \">Location</h2><p>New York, NY (HQ); Remote (Canada); Remote (US); San Francisco, CA</p></div><div class=\" _section_f7cvd_36 \"><h2 class=\"_heading_f7cvd_52 \">Employment Type</h2><p>Full time</p></div><div class=\" _section_f7cvd_36 \"><h2 class=\"_heading_f7cvd_52 \">Location Type</h2><p>Hybrid</p></div><div class=\" _section_f7cvd_36 \"><h2 class=\"_heading_f7cvd_52 \">Department</h2><p>Engineering</p></div><div class=\" _section_f7cvd_36 \"><h2 class=\"_heading_f7cvd_52 \">Compensation</h2><ul class=\"_compensationTierList_5yu8i_308\"><li class=\"_compensationTierListItem_5yu8i_314\"><span class=\"_compensationTierSummary_5yu8i_330\">$189K – $330K • Offers Equity</span></li></ul><div class=\"_compensationPhilosophy_5yu8i_345\"><p style=\"min-height:1.5em\">The final compensation will depend on the location and level at which the candidate is hired.</p></div></div></div><div class=\"ashby-job-posting-right-pane\"><nav class=\"_tabs_5yu8i_29\" role=\"tablist\"><a aria-current=\"page\" class=\"_tab_5yu8i_29 _active_5yu8i_56\" id=\"job-overview\" aria-controls=\"overview\" tabindex=\"0\" aria-selected=\"true\" role=\"tab\" href=\"/ramp/f564dcf9-9390-4a3f-896f-8047a5086040\"><span class=\"ashby-job-posting-right-pane-overview-tab\">Overview</span></a><a class=\"_tab_5yu8i_29\" id=\"job-application-form\" aria-controls=\"form\" tabindex=\"-1\" aria-selected=\"false\" role=\"tab\" href=\"/ramp/f564dcf9-9390-4a3f-896f-8047a5086040/application\"><span class=\"ashby-job-posting-right-pane-application-tab\">Application</span></a><span class=\"_slider_5yu8i_65 ashby-job-posting-right-pane-tab-slider\"></span></nav><div tabindex=\"0\" role=\"tabpanel\" aria-labelledby=\"job-overview\" id=\"overview\" class=\"_description_5yu8i_201 ashby-job-posting-description-container  _container_f7cvd_28\" data-highlight=\"none\"><div class=\"_descriptionText_5yu8i_201 ashby-job-posting-description\"><h1><strong>About Ramp</strong></h1><p style=\"min-height:1.5em\">Ramp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.</p><p style=\"min-height:1.5em\">The problems are high-stakes, data-dense, and unforgiving.</p><p style=\"min-height:1.5em\">We hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.</p><p style=\"min-height:1.5em\">The median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.</p><p style=\"min-height:1.5em\">If you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.</p><p style=\"min-height:1.5em\"></p><h1>About the Role</h1><p style=\"min-height:1.5em\">As an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.</p><p style=\"min-height:1.5em\">Check out our <a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://engineering.ramp.com/\">Engineering Blog</a> for more on our tech stack, mission and values!</p><h2><br><br>What You’ll Do</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Design, build, and launch new products to Ramp’s Android app</p></li><li><p style=\"min-height:1.5em\">Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity</p></li><li><p style=\"min-height:1.5em\">Conduct code reviews and set engineering standards</p></li><li><p style=\"min-height:1.5em\">Work with Product and Design to identify key features that will make the app successful</p></li><li><p style=\"min-height:1.5em\">Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product</p><p style=\"min-height:1.5em\"></p></li></ul><h2>What You Need</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Minimum 1 year of experience in mobile development</p></li><li><p style=\"min-height:1.5em\">Proficiency in Kotlin and Compose for Android development</p></li><li><p style=\"min-height:1.5em\">Experience launching at least one mobile app and/or several features that reached a large number of users</p></li><li><p style=\"min-height:1.5em\">Desire to work in a fast-paced environment, continuously grow, and master your craft</p></li><li><p style=\"min-height:1.5em\">Strong understanding of mobile design patterns and best practices</p></li></ul><p style=\"min-height:1.5em\"></p><h2>Nice to Haves</h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Experience with web apps (React, TypeScript)</p></li><li><p style=\"min-height:1.5em\">Experience with backend technologies (Python, Flask, SQL, OpenAPI)</p></li><li><p style=\"min-height:1.5em\">Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI &amp; Buildkite</p></li><li><p style=\"min-height:1.5em\">Experience managing apps in the Google Play Console</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Benefits available to all full-time Ramp employees (Global)</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Flexible PTO</p></li><li><p style=\"min-height:1.5em\">Centralized home-office equipment ordering</p></li><li><p style=\"min-height:1.5em\">Health and wellness stipend</p></li><li><p style=\"min-height:1.5em\">Budget for intra-office travel</p></li><li><p style=\"min-height:1.5em\">Weekly coffee stipend</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>United States</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">100% medical, dental &amp; vision insurance coverage for you, with partial coverage for dependents</p></li><li><p style=\"min-height:1.5em\">One Medical annual membership</p></li><li><p style=\"min-height:1.5em\">401(k), including employer match on contributions made while employed by Ramp</p></li><li><p style=\"min-height:1.5em\">Fertility HRA (up to $10,000 per year)</p></li><li><p style=\"min-height:1.5em\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay</p></li><li><p style=\"min-height:1.5em\">Pet insurance</p></li><li><p style=\"min-height:1.5em\">In-office perks: lunch, snacks, drinks, and more</p></li><li><p style=\"min-height:1.5em\">Relocation expense coverage to NYC or SF (if needed)</p><p style=\"min-height:1.5em\"></p></li></ul><h2><strong>Canada</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Group medical, dental, and vision coverage through Sun Life</p></li><li><p style=\"min-height:1.5em\">Life, AD&amp;D, and disability coverage</p></li><li><p style=\"min-height:1.5em\">Fertility drug coverage (up to $4,000 lifetime)</p></li><li><p style=\"min-height:1.5em\">Group Retirement Plan with employer match (RRSP + DPSP)</p></li><li><p style=\"min-height:1.5em\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay</p></li><li><p style=\"min-height:1.5em\">Employee Assistance Program and virtual care through Lumino Health</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>United Kingdom</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">Private medical insurance through Freedom Elite</p></li><li><p style=\"min-height:1.5em\">Virtual GP and at-home care via eMed x Livi</p></li><li><p style=\"min-height:1.5em\">Workplace pension through Penfold, with salary sacrifice option</p></li><li><p style=\"min-height:1.5em\">Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>Referral Instructions</strong></h2><p style=\"min-height:1.5em\">If you are being referred for the role, please contact that person to apply on your behalf.</p><div style=\"min-height:1.2em;margin-top:0px;margin-bottom:0px\">&nbsp;</div><h2><strong>Other notices</strong></h2><p style=\"min-height:1.5em\">Pursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.</p><div style=\"min-height:1.2em;margin-top:0px;margin-bottom:0px\">&nbsp;</div><p style=\"min-height:1.5em\"><em>Beware of recruiting scams: Ramp will only contact you through official @</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"http://Ramp.com\"><em>Ramp.com</em></a><em> email addresses and will never ask for payment or sensitive personal information during the hiring process.</em></p><div style=\"min-height:1.2em;margin-top:0px;margin-bottom:0px\">&nbsp;</div><p style=\"min-height:1.5em\"><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://ramp.com/legal/applicant-privacy-notice\">Ramp Applicant Privacy Notice</a></p><p style=\"display: none;\">Compensation Range: $189K - $330K</p></div><a class=\" _container_j2da7_1\" href=\"/ramp/f564dcf9-9390-4a3f-896f-8047a5086040/application\"><button class=\"_button_zyh3g_28 _primary_zyh3g_97  _greedy_zyh3g_221  \">Apply for this Job</button></a></div></div></div></div><footer class=\"_container_1jx4x_28 \"><a href=\"https://www.ashbyhq.com\" target=\"_blank\" rel=\"noopener\" class=\"_powered_1jx4x_58\" aria-label=\"Learn more about Ashby\"><span>Powered by&nbsp;</span></a><p class=\"_links_1jx4x_97\"><a href=\"https://www.ashbyhq.com/privacy\" target=\"_blank\" rel=\"noopener\" class=\"_link_1jx4x_78\">Privacy Policy</a><a href=\"https://www.ashbyhq.com/security\" target=\"_blank\" rel=\"noopener\" class=\"_link_1jx4x_78\">Security</a><a href=\"https://www.ashbyhq.com/disclosure\" target=\"_blank\" rel=\"noopener\" class=\"_link_1jx4x_78\">Vulnerability Disclosure</a></p></footer><div class=\"_toasts_1bmj4_58\"></div></div>\n      \n</body></html>"
    text: 'Software Engineer, Android

      Location

      New York, NY (HQ); Remote (Canada); Remote (US); San Francisco, CA

      Employment Type

      Full time

      Location Type

      Hybrid

      Department

      Engineering

      Compensation

      $189K – $330K • Offers Equity

      The final compensation will depend on the location and level at which the candidate is hired.

      OverviewApplication

      About Ramp

      Ramp is building the smart infrastructure for finance teams, embedded in the transaction flow of every dollar a business spends. We automate how over $275B in annualized spend flows in and out of 85,000+ companies: authorizing payments, flagging risk, categorizing spend, and closing books.

      The problems are high-stakes, data-dense, and unforgiving.

      We hire people with high agency and high urgency. We look for slope over intercept. We care less about where you trained and more about what you’ve built. At Ramp, everyone is a builder who owns problems end to end and makes consequential decisions that shape the outcome.

      The median Ramp customer saves 7.5% and grows revenue 16% in their first year – far in excess of businesses operating without Ramp. We believe every ambitious company deserves the same.

      If you want to build systems that directly shape how companies move and manage billions, Ramp is the place to do it.

      About the Role

      As an Android Engineer at Ramp, you’ll enhance our successful and rapidly growing mobile app. You will improve the core platform that thousands of businesses rely on while also building the future of automated finance by integrating AI and intelligent agents into the mobile experience. This is a chance to grow your skills on a proven product and define the next generation of fintech.

      Check out our Engineering Blog for more on our tech stack, mission and values!

      What You’ll Do

      Design, build, and launch new products to Ramp’s Android app

      Help establish engineering processes, tools, and systems that allow us to scale the code base and productivity

      Conduct code reviews and set engineering standards

      Work with Product and Design to identify key features that will make the app successful

      Work alongside Product and other cross-functional teams to understand customer feedback and continuously improve our product

      What You Need

      Minimum 1 year of experience in mobile development

      Proficiency in Kotlin and Compose for Android development

      Experience launching at least one mobile app and/or several features that reached a large number of users

      Desire to work in a fast-paced environment, continuously grow, and master your craft

      Strong understanding of mobile design patterns and best practices

      Nice to Haves

      Experience with web apps (React, TypeScript)

      Experience with backend technologies (Python, Flask, SQL, OpenAPI)

      Experience with our mobile stack in addition to Kotlin and Compose: MVVM, coroutines, flows, gradle, OpenAPI & Buildkite

      Experience managing apps in the Google Play Console

      Benefits available to all full-time Ramp employees (Global)

      Flexible PTO

      Centralized home-office equipment ordering

      Health and wellness stipend

      Budget for intra-office travel

      Weekly coffee stipend

      United States

      100% medical, dental & vision insurance coverage for you, with partial coverage for dependents

      One Medical annual membership

      401(k), including employer match on contributions made while employed by Ramp

      Fertility HRA (up to $10,000 per year)

      Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay

      Pet insurance

      In-office perks: lunch, snacks, drinks, and more

      Relocation expense coverage to NYC or SF (if needed)

      Canada

      Group medical, dental, and vision coverage through Sun Life

      Life, AD&D, and disability coverage

      Fertility drug coverage (up to $4,000 lifetime)

      Group Retirement Plan with employer match (RRSP + DPSP)

      Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay, with additional time available at reduced pay

      Employee Assistance Program and virtual care through Lumino Health

      United Kingdom

      Private medical insurance through Freedom Elite

      Virtual GP and at-home care via eMed x Livi

      Workplace pension through Penfold, with salary sacrifice option

      Parental leave: up to 16 weeks (birthing + bonding) or 8 weeks (bonding only) at 100% pay with additional time available at reduced pay

      Referral Instructions

      If you are being referred for the role, please contact that person to apply on your behalf.

      Other notices

      Pursuant to the San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.

      Beware of recruiting scams: Ramp will only contact you through official @Ramp.com email addresses and will never ask for payment or sensitive personal information during the hiring process.

      Ramp Applicant Privacy Notice

      Compensation Range: $189K - $330K

      Apply for this Job

