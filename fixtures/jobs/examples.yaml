n the battlefield, locate missing children, and more. Applications for the January 2027 cohort are open now through December 11, 2026. The Program In the 20th century, America pioneered mass production. We built the Arsenal of Democracy and won the war. Then we left this mighty Arsenal to rust. Silicon Valley, a product of Heartland work ethic, turned its back on the American worker. It''s time to reawaken the giant. The same spirit of practical innovation that enabled America to dominate the previous century lives on in every American factory, workshop, and garage today. Some fear the proliferation of Artificial Intelligence, but we see the opportunity for a technological and industrial renaissance. Palantir is launching the Americ"><meta property="og:url" content="https://jobs.lever.co/palantir/0ccbe620-a3ef-41d1-a5c4-68e56b3c91d0"><meta property="og:image" content="https://lever-client-logos.s3-us-west-2.amazonaws.com/b8300af6-ed1c-4d0b-8956-cee7839555b9-1586196845320.png"><meta property="og:image:height" content="630"><meta property="og:image:width" content="1200"></head><body class="show header-compact"><div class="cc-revoke cc-bottom cc-animate" style="display: none;">Cookie Policy</div><div role="dialog" aria-live="polite" aria-label="cookieconsent" aria-describedby="cookieconsent:desc" class="cc-window cc-banner cc-type-opt-in cc-theme-block cc-bottom " style=""><div class="momentum-body"><div class="message message-inverse flex-column"><div class="icon">🍪</div><div class="message-buttons cc-desktop"><button class="button button-sm cc-btn cc-deny" href="#">Deny</button><button class="button button-sm button-primary cc-btn cc-allow" href="#">Accept</button></div><h4 class="text-white">Privacy Notice</h4><p>This website uses cookies to improve your web experience. By clicking <b>Accept</b>, you agree to the use of cookies. <a class="cookie-banner-link" href="https://www.employinc.com/cookie-policy/" target="_blank">Cookie Policy</a></p><div class="self-end cc-mobile m1"><button class="button button-sm cc-btn cc-deny" href="#">Deny</button><button class="button button-sm button-primary cc-btn cc-allow" href="#">Accept</button></div></div></div></div><div class="page show"><div class="main-header page-full-width section-wrapper"><div class="main-header-content page-centered narrow-section page-full-width"><a href="https://jobs.lever.co/palantir" class="main-header-logo"><img alt="Palantir Technologies logo" src="https://lever-client-logos.s3.us-west-2.amazonaws.com/b8300af6-ed1c-4d0b-8956-cee7839555b9-1599675095718.png"></a></div></div></div><div class="content-wrapper posting-page"><div class="content"><div class="section-wrapper accent-section page-full-width"><div class="section page-centered posting-header"><div class="posting-headline"><h2>American Tech Fellowship</h2><div class="posting-categories"><div href="#" class="sort-by-time posting-category medium-category-label width-full capitalize-labels location">North America</div><div href="#" class="sort-by-team posting-category medium-category-label capitalize-labels department">Business Development /</div><div href="#" class="sort-by-commitment posting-category medium-category-label capitalize-labels commitment">Scholarship /</div><div href="#" class="sort-by-time posting-category medium-category-label capitalize-labels workplaceTypes">Remote</div></div></div><div class="postings-btn-wrapper"><a class="postings-btn template-btn-submit black" href="https://jobs.lever.co/palantir/0ccbe620-a3ef-41d1-a5c4-68e56b3c91d0/apply">Apply</a></div></div></div><div class="section-wrapper page-full-width"><div class="section page-centered" data-qa="job-description"><div><strong style="font-size: 18px;">A World-Changing Company</strong></div>

      <div>&nbsp;</div>

      <div>Palantir builds the world’s leading software for data-driven decisions and operations. By bringing the right data to the people who need it, our platforms empower our partners to develop lifesaving drugs, power decisions on the battlefield, locate missing children, and more.</div>

      <div>&nbsp;</div>

      <h3><strong>Applications for the January 2027 cohort are open now through December 11, 2026. </strong></h3>

      <div>&nbsp;</div>

      <div><strong style="font-size: 18px;">The Program</strong></div>

      <div>&nbsp;</div>

      <div>In the 20th century, America pioneered mass production. We built the Arsenal of Democracy and won the war. Then we left this mighty Arsenal to rust. Silicon Valley, a product of Heartland work ethic, turned its back on the American worker.<br><br>It''s time to reawaken the giant.<br><br>The same spirit of practical innovation that enabled America to dominate the previous century lives on in every American factory, workshop, and garage today. Some fear the proliferation of Artificial Intelligence, but we see the opportunity for a technological and industrial renaissance.<br><br>Palantir is launching the American Tech Fellowship to arm Americans with the skills to deploy cutting-edge software in the workforce. You will have an opportunity to explore and build on Palantir''s Artificial Intelligence Platform (AIP) and earn a professional certification in its use. Exceptional performers will earn an opportunity to interview for a role at Palantir or partner companies, where you can use your newfound skills to contribute to the revival of American industry.<br><br>This fellowship is about more than careers. It''s about restoring the promise that hard work and determination can still change your life in America. It''s an investment in American excellence, and evidence of our belief that America''s greatest builders are still to be discovered.<br><br>The American worker, given the right tools and opportunity, remains our competitive advantage. It''s time to prove it.</div>

      <div>&nbsp;</div>

      <div><strong style="font-size: 18px;">The Role</strong></div>

      <div>&nbsp;</div>

      <div>In this fellowship, you''ll participate in a comprehensive training program with our partner, <a href="https://www.ontologize.com/">Ontologize</a>, to level up your technical skills on Foundry and AIP. You''ll learn how to deploy Palantir''s advanced software to solve tough problems in enterprise settings and have the opportunity to engage directly with Palantir engineers and leadership.<br><br>The fellowship runs for 12 weeks, beginning on January 13, 2027. You are expected to attend live virtual sessions on two weeknights each week. We will also have optional sessions once a week and office hours throughout the duration of the program. Expect to spend 10 to 15 hours per week on instruction and project work throughout the fellowship. <br><br>This program provides valuable training to participants and is unpaid.<br><br>The window for submitting American Tech Fellowship applications is now through December 11, 2026.</div>

      <div>&nbsp;</div></div><div class="section page-centered"><div><h3>What We’re Looking For</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><div>We want builders: people who are hungry to learn whatever it takes to succeed and aren''t afraid to roll up their sleeves and make it happen.<br><br>You might be that kind of person if you''ve taught yourself, or been the local go-to, in one or more of these areas:

      <ul>

      <li>Software, data, or automation</li>

      <li>General-purpose programming languages such as Python, C/C++, C# / .NET, Rust, Go, Java, TypeScript/JavaScript</li>

      <li>Data science applications such as SQL, MATLAB, Simulink, R, Julia, Excel + VBA</li>

      <li>Process improvements like instrumenting, automating, or optimizing how things run</li>

      <li>Prototyping—i.e., testing ideas iteratively instead of waiting for perfect specs</li>

      </ul>

      </div></div></div></div></div><div class="section page-centered"><div><h3>What We Value</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><div>Show us where you''ve flexed that builder''s mindset. That could look like:

      <ul>

      <li>Formal study in computer science, electrical/mechanical/control systems engineering, physics, applied math, data science, mechatronics, robotics, or a related field</li>

      <li>Experience solving real problems in settings such as a factory floor, a warehouse or logistics hub, a hospital or clinic, a construction site, field service, energy or utility operations, the military, a small business, or a garage shop, especially if you automated, instrumented, or optimized a process</li>

      <li>Startup, maker-space, or hackathon projects that blended hardware and software, such as retrofitting equipment, building a sensor network, or deploying an edge AI model</li>

      <li>Publications, patents, or open-source contributions in software, data, automation, or related technical fields</li>

      </ul>

      If you''ve got the fire to learn and you''ve built something that moved the needle, you''re the kind of American worker we designed this fellowship for.<br><br>Backgrounds in skilled trades, manufacturing, and field work, as well as in clinical or business settings, are welcome.</div></div></div></div></div><div class="section page-centered"><div><h3>What We Require</h3><div class="posting-requirements plain-list" data-qa="posting-requirements"><div><div>

      <ul>

      <li>2+ years of hands-on work experience in a technical setting or engaging in on-the-job technical processes</li>

      <li>Backgrounds in computer science, data science, physics, and engineering domains are preferred, though no formal degree is required.</li>

      </ul>

      </div></div></div></div></div><div class="section page-centered" data-qa="closing-description"><div><em>Please note that you will never be asked to submit a payment or share financial information to participate in our interview process. If you suspect that you''ve been contacted by a scammer, we recommend you cease all communication with the individual and consider reporting them to the relevant authorities, such as the US&nbsp;<a href="https://www.ic3.gov/">FBI Internet Crime Complaint Center (IC3)</a>.</em><br><br><em>If you would like to understand more about how your personal data will be processed by Palantir, please see our&nbsp;<a href="https://www.palantir.com/privacy-and-security/candidate-privacy-notice/">Privacy Policy</a>.</em></div></div><div class="section page-centered last-section-apply" data-qa="btn-apply-bottom"><a class="postings-btn template-btn-submit black" data-qa="show-page-apply" href="https://jobs.lever.co/palantir/0ccbe620-a3ef-41d1-a5c4-68e56b3c91d0/apply">Apply</a></div></div></div></div><div class="main-footer page-full-width"><div class="main-footer-text"><p><a href="https://www.palantir.com/">Palantir Technologies Home Page</a></p><a href="https://www.lever.co/job-seeker-support/" class="image-link"><span>Jobs powered by </span><img alt="Lever logo" src="/img/lever-logo-refresh.svg" class="footer-logo"></a></div></div><script type="application/ld+json">{"@context" : "http://schema.org","@type" : "JobPosting","title" : "American Tech Fellowship","hiringOrganization" : {"@type" : "Organization","name": "Palantir Technologies","logo": "https://lever-client-logos.s3.us-west-2.amazonaws.com/b8300af6-ed1c-4d0b-8956-cee7839555b9-1599675095718.png"},"jobLocation":{"@type" : "Place","address" : {"@type" : "PostalAddress","addressLocality" : "North America","addressRegion" : null,"addressCountry" : null,"postalCode" : null}},"employmentType" : "Scholarship","datePosted" : "2025-06-17","description" : "<p><strong style=\"font-size: 18px;\"