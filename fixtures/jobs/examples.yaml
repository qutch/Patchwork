growth</p></li></ul><p style=\\\"min-height:1.5em\\\">Check out our <a target=\\\"_blank\\\" rel=\\\"noopener noreferrer nofollow\\\" href=\\\"https://engineering.ramp.com/\\\">Engineering Blog</a> for more on our tech stack, mission and values!</p><p style=\\\"min-height:1.5em\\\"></p><p style=\\\"min-height:1.5em\\\">What You’ll Do</p><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Drive our cloud security roadmap: review our cloud deployments to identify opportunities for improvement</p></li><li><p style=\\\"min-height:1.5em\\\">Design and build security-focused infrastructure primitives and integrate them into our existing products and development processes</p></li><li><p style=\\\"min-height:1.5em\\\">Lead remediation of prioritized issues across our technology stack</p></li><li><p style=\\\"min-height:1.5em\\\">Partner with infrastructure, data, and devops teams to design and deploy solutions that are inherently secure</p></li></ul><p style=\\\"min-height:1.5em\\\"></p><h2>What You Need</h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Minimum 5 years of experience building software</p></li><li><p style=\\\"min-height:1.5em\\\">Minimum 3 years of experience building in AWS (with Terraform)</p></li><li><p style=\\\"min-height:1.5em\\\">A strong sense of ownership: you need to drive projects from inception to scaling it in production</p></li><li><p style=\\\"min-height:1.5em\\\">Desire to work in a fast-paced environment, continuously grow, and master your craft</p></li></ul><p style=\\\"min-height:1.5em\\\"></p><h2>Nice-to-Haves</h2><ul style=\\\"min-height:1.5em\\\"><li><p style=\\\"min-height:1.5em\\\">Experience with Python (Flask) and Terraform</p></li><li><p style=\\\"min-height:1.5em\\\">Experience with Azure, GCP, and other cloud providers</p></li><li><p style=\\\"min-height:1.5em\\\">Experience improving the developer experience and security properties of a multi-service deployment</p></li></ul><p styl