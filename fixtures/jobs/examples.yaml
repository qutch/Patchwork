    html: "<!DOCTYPE html><html lang=\"en\" dir=\"ltr\"><head><meta http-equiv=\"origin-trial\" content=\"3NNj0GXVktLOmVKwWUDendk4Vq2qgMVDBDX+Sni48ATJl9JBj+zF+9W2HGB3pvt6qowOihTbQgTeBm9SKbdTwYAAABfeyJvcmlnaW4iOiJodHRwczovL3JlY2FwdGNoYS5uZXQ6NDQzIiwiZmVhdHVyZSI6IlRwY2QiLCJleHBpcnkiOjE3MzUzNDM5OTksImlzVGhpcmRQYXJ0eSI6dHJ1ZX0=\"><meta http-equiv=\"origin-trial\" content=\"A6iYDRdcg1LVww9DNZEU+JUx2g1IJxSxk4P6F+LimR0ElFa38FydBqtz/AmsKdGr11ZooRgDPCInHJfGzwtR+A4AAACXeyJvcmlnaW4iOiJodHRwczovL3d3dy5yZWNhcHRjaGEubmV0OjQ0MyIsImZlYXR1cmUiOiJEaXNhYmxlVGhpcmRQYXJ0eVN0b3JhZ2VQYXJ0aXRpb25pbmczIiwiZXhwaXJ5IjoxNzU3OTgwODAwLCJpc1N1YmRvbWFpbiI6dHJ1ZSwiaXNUaGlyZFBhcnR5Ijp0cnVlfQ==\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><meta property=\"og:image\" content=\"https://s2-recruiting.cdn.greenhouse.io/external_greenhouse_job_boards/logos/400/025/200/original/New_Linkedin_Logo_LinkedIn.png?1725582586\"><meta property=\"og:type\" content=\"article\"><link rel=\"canonical\" href=\"http://job-boards.greenhouse.io/discord/jobs/8927168002\"><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&amp;family=Poppins:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700\"><title>Job Application for Account Executive, Mobile Gaming at Discord</title><meta property=\"og:title\" content=\"Account Executive, Mobile Gaming\"><meta property=\"og:description\" content=\"San Francisco Bay Area\"><meta property=\"og:url\" content=\"https://job-boards.greenhouse.io/discord/jobs/8927168002\"><link rel=\"stylesheet\" href=\"https://job-boards.cdn.greenhouse.io/assets/entry-nimHAKwV.css\"><link rel=\"stylesheet\" href=\"https://job-boards.cdn.greenhouse.io/assets/vendor-CKKDukwa.css\"></head><body style=\"--custom-link-color:#3442D9;--custom-active-field-color:#3442D9;--custom-focus-color:#3442D9;--custom-list-hover-color:#808AFF;--custom-primary-typography-color:#3442D9;--custom-button-color:#3442D9;--custom-button-hover-color:#3442D9;--custom-button-text-color:#FFFFFF;--custom-primary-font-family:&quot;Poppins&quot;;--custom-secondary-font-family:&quot;Poppins&quot;;--custom-dropdown-selection-color:#808AFF;--custom-secondary-typography-color:#262626;--custom-secondary-typography-10:#2626261A;--custom-secondary-typography-30:#2626264D;--custom-secondary-typography-60:#26262699;--custom-background-color:#ffffff\"><div class=\"banner-container\"><img src=\"https://s2-recruiting.cdn.greenhouse.io/job_board_renderer/job_board_configurations/banners/400/017/000/original/LinkedIn_Banner_May_2024.png?1725582587\" alt=\"Banner\" class=\"banner\"></div><div id=\"react-portal-mount-point\"></div><main class=\"main font-secondary job-post\"><div class=\"job-post-container\"><div class=\"image-container\"><a href=\"https://boards.greenhouse.io/discord\" target=\"_blank\" rel=\"noreferrer\" class=\"logo\"><img src=\"https://s2-recruiting.cdn.greenhouse.io/external_greenhouse_job_boards/logos/400/025/200/original/New_Linkedin_Logo_LinkedIn.png?1725582586\" alt=\"Discord Logo\" class=\"\"></a></div><div><a class=\"link\" target=\"_top\" href=\"https://job-boards.greenhouse.io/discord\">Back to jobs</a><div class=\"job__tags\"><span class=\"tag-container\" style=\"margin-left:0\"><span class=\"ellipse\"><span class=\"tag-text\">New</span></span></span></div><div class=\"job__header\"><div class=\"job__title\"><h1 class=\"section-header section-header--large font-primary\">Account Executive, Mobile Gaming</h1><div class=\"job__location\"><div>San Francisco Bay Area</div></div></div><button type=\"button\" class=\"btn btn--rounded\" aria-label=\"Apply\">Apply</button></div><div class=\"job__description body\"><div><p>Discord has a highly engaged community of millions of daily active users who use the platform for many different reasons, but there’s one thing that nearly everyone does: <strong>play video games.</strong> Discord plays a uniquely important role in the future of gaming, and we are focused on making it easier and more fun for people to hang out before, during, and after playing games.</p></div><div><p>We're looking for an experienced Account Executive to join our Advertising Solutions (Quests) team to grow our mobile gaming advertising business. This is a strategic individual contributor role for a performance-minded seller who knows how performance marketers buy: you speak fluently about MMP integrations, CPI and ROAS goals, and how user acquisition teams evaluate a new channel.</p>\n<p>You'll prospect and close new partners, work with growth teams to plan and optimize campaigns, and bring what you learn back to our Product teams to shape how Discord serves performance advertisers.</p>\n<p><strong>What You'll Be Doing</strong></p>\n<ul>\n<li>Drive new revenue: Own a $[XX]M+ annual revenue target across mobile gaming advertisers, from prospecting through negotiation and close.</li>\n<li>Sell performance: Build proposals around advertiser goals like CPI, ROAS, and retention, and help clients set up and read results through their mobile measurement partners (MMPs).</li>\n<li>Build relationships with performance marketers: Develop trusted relationships with user acquisition, growth, and marketing leaders at mobile game publishers and their agencies.</li>\n<li>Bring the market back to Discord: Share client and market insights with Product, Product Marketing, and Measurement teams to shape performance features and ad products.</li>\n<li>Represent Discord externally: Be a voice for Discord in the mobile gaming and app marketing community, at client meetings and industry events, with a focus on protecting the user experience.</li>\n<li>Build repeatable processes: Partner across the sales organization to build scalable processes, forecasts, and playbooks for performance advertisers.</li>\n</ul>\n<p><strong>What you should have</strong></p>\n<ul>\n<li>6+ years in digital media or advertising sales, including meaningful time selling performance or app-install solutions to mobile game publishers.</li>\n<li>Hands-on fluency with mobile measurement and attribution, including MMP integrations (e.g., AppsFlyer, Adjust, Singular) and how they shape campaign setup and reporting.</li>\n<li>A track record of selling against CPI, CPA, and ROAS goals, and partnering with clients to optimize toward them.</li>\n<li>Experience influencing user acquisition, growth, and marketing leaders at performance advertisers and their agencies.</li>\n<li>Strong foundational sales skills: prospecting, forecasting, negotiating, and structuring non-standard deals.</li>\n<li>Comfort using campaign data to diagnose performance and make the case for optimizations or increased investment.</li>\n<li>Willingness to travel for in-person client meetings and industry events.</li>\n</ul>\n<p>&nbsp;<strong>Bonus points</strong></p>\n<ul>\n<li>Existing relationships with mobile user acquisition teams or performance agencies.</li>\n<li>Experience opening a new advertising channel or product for performance marketers.</li>\n<li>Familiarity with rewarded or incentivized ad formats.</li>\n<li>Understanding of how privacy changes (e.g., SKAdNetwork, Privacy Sandbox on Android) affect app measurement.</li>\n</ul>\n<p><em>Candidates must reside in or be willing to relocate to the San Francisco Bay Area (Alameda, Contra Costa, Marin, Napa, San Francisco, San Mateo, Santa Clara, Solano, and Sonoma counties). Relocation assistance may be available.&nbsp;</em><em>For this role, the Hiring Manager would like folks to be in the office 3</em><em> days a week.</em></p></div><div class=\"job__pay-ranges\"><div class=\"pay-range\"><div class=\"description\"><div class=\"body\"><span><p><em>This position is commission-based and is eligible for variable incentive. The On Target Earnings (OTE) range for this full-time position is listed below. This position will also be eligible for equity and benefits. Benefits include medical, dental, and vision insurance; a 401(k) plan; life and disability insurance; paid vacation, sick time, and holidays; and paid parental, medical, and caregiver leave. Our ranges are determined by role and level. Within the range, individual pay is determined by additional factors, including job-related skills, experience, and relevant education or training. Please note that the compensation details listed in role postings reflect the On Target Earnings only, and do not include equity, or benefits. Applications for this role are accepted on an ongoing basis.</em></p></span></div></div><p class=\"body body--medium\">On Target Earnings</p><p class=\"body\"><bdi>$272,000</bdi> - <bdi>$306,000</bdi> <bdi>USD</bdi></p></div></div><div><p><strong>Why Discord?&nbsp;</strong><br><br>Discord plays a uniquely important role in the future of gaming. We're a multiplatform, multigenerational and multiplayer platform that helps people deepen their friendships around games and shared interests, and helps developers build and grow their businesses. We believe games give us a way to have fun with our favorite people, whether listening to music together or grinding in competitive matches for diamond rank. <strong>Join us in our mission! Your future is just a click away!</strong></p>\n<p><strong>Discord is committed to inclusion and providing reasonable accommodations during the interview process. </strong>We want you to feel set up for success, so if you are in need of reasonable accommodations, please let your recruiter know.</p>\n<p><em><strong>Please see our Applicant and Candidate Privacy Policy for details regarding Discord’s collection and usage of personal information relating to the application and recruitment process by clicking&nbsp;<a href=\"https://discord.com/terms/applicant-candidate-privacy-policy\">HERE.</a></strong></em></p></div></div></div><div class=\"divider\" role=\"separator\"></div><div class=\"application--container\"><div class=\"application--header\"><div class=\"application--header--text\"><div class=\"application--header--title\"><h2 class=\"section-header font-primary\">Apply for this job</h2></div><div class=\"application--header--required\"><div class=\"application--header--required--asterisk\"><p class=\"body body__secondary\">*</p></div><p class=\"body body__secondary\">indicates a required field</p></div></div><div class=\"application--header--buttons\"><div class=\"application--header--apply-with-seek\"></div></div></div><form method=\"get\" action=\"/discord/jobs/8927168002\" id=\"application-form\" class=\"application--form\" data-discover=\"true\"><div class=\"application--questions\"><div class=\"field-wrapper\"><div class=\"text-input-wrapper\"><div class=\"input-wrapper\"><label id=\"first_name-label\" for=\"first_name\" class=\"label label\">First Name<span aria-hidden=\"true\">*</span></label><input id=\"first_name\" class=\"input input__single-line\" aria-label=\"First Name\" aria-describedby=\"first_name-description first_name-error first_name-help\" aria-invalid=\"false\" aria-errormessage=\"first_name-error\" aria-required=\"true\" type=\"text\" maxlength=\"255\" autocomplete=\"given-name\" value=\"\"></div></div></div><div class=\"field-wrapper\"><div class=\"text-input-wrapper\"><div class=\"input-wrapper\"><label id=\"last_name-label\" for=\"last_name\" class=\"label label\">Last Name<span aria-hidden=\"true\">*</span></label><input id=\"last_name\" class=\"input input__single-line\" aria-label=\"Last Name\" aria-describedby=\"last_name-description last_name-error last_name-help\" aria-invalid=\"false\" aria-errormessage=\"last_name-error\" aria-required=\"true\" type=\"text\" maxlength=\"255\" autocomplete=\"family-name\" value=\"\"></div></div></div><div class=\"field-wrapper\"><div class=\"text-input-wrapper\"><div class=\"input-wrapper\"><label id=\"email-label\" for=\"email\" class=\"label label\">Email<span aria-hidden=\"true\">*</span></label><input id=\"email\" class=\"input input__single-line\" aria-label=\"Ema