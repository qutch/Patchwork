[project]
name = "patchwork"
version = "0.1.0"
description = "Demonstrate a data-transfer task once; agents compile it into a versioned integration that runs with zero LLM calls."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "selectolax==1.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
agents = [
    "deepagents==0.7.38",
    "langchain-openrouter==0.2.9",
    "langgraph==1.2.22",
    "langgraph-checkpoint-sqlite==3.1.3",
    "jsonpatch==1.47",
]
capture = ["playwright==1.65.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
